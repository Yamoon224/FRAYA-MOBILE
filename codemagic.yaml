workflows:
  ios-release:
    name: iOS Release (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      groups:
        - fraya_env
        - ios_signing

    scripts:
      - name: Créer le fichier .env
        script: |
          cat > "$CM_BUILD_DIR/.env" << EOF
          GOOGLE_MAPS_API_KEY_ANDROID=$GOOGLE_MAPS_API_KEY_ANDROID
          GOOGLE_MAPS_API_KEY_IOS=$GOOGLE_MAPS_API_KEY_IOS
          GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY
          SERVER_URL=$SERVER_URL
          ONESIGNAL_APP_ID_PASSENGER=$ONESIGNAL_APP_ID_PASSENGER
          ONESIGNAL_APP_ID_DRIVER=$ONESIGNAL_APP_ID_DRIVER
          WHATSAPP_SUPPORT_NUMBER=$WHATSAPP_SUPPORT_NUMBER
          EOF
          echo "✅ .env créé"
          ls -la "$CM_BUILD_DIR/.env"

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Pod install
        script: |
          cd ios
          pod install

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
