# Deux applications iOS construites depuis le même projet : un workflow par flavor.
# Les identifiants de bundle viennent du projet Xcode (ios/Runner.xcodeproj) :
#   passager  -> com.carrementweb.frayaMobile.passenger  (scheme Passenger)
#   chauffeur -> com.carrementweb.frayaMobile.driver     (scheme Driver)
# Chaque identifiant doit exister dans Apple Developer (App ID) et dans App Store Connect (application).
workflows:
  ios-passenger-release:
    name: iOS Passager (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      groups:
        - fraya_env
      ios_signing:
        distribution_type: app_store  # ou ad_hoc pour les tests
        bundle_identifier: com.carrementweb.frayaMobile.passenger

    # Intégration App Store Connect (Personal account > Integrations > Developer Portal) : nom a verifier.
    integrations:
      app_store_connect: Keita_Fraya

    scripts:
      - name: Créer le fichier .env
        script: |
          cat > "$CM_BUILD_DIR/.env" << EOF
          GOOGLE_MAPS_API_KEY_ANDROID=$GOOGLE_MAPS_API_KEY_ANDROID
          GOOGLE_MAPS_API_KEY_IOS=$GOOGLE_MAPS_API_KEY_IOS
          GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY
          SERVER_URL=$SERVER_URL
          ONESIGNAL_APP_ID_PASSENGER=$ONESIGNAL_APP_ID_PASSENGER
          ONESIGNAL_APP_ID_DRIVER=$ONESIGNAL_APP_ID_DRIVER
          WHATSAPP_SUPPORT_NUMBER=$WHATSAPP_SUPPORT_NUMBER
          EOF
          echo "✅ .env créé"
          ls -la "$CM_BUILD_DIR/.env"

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Pod install
        script: |
          cd ios && pod install

      - name: Appliquer les profils de signature au projet Xcode
        script: |
          xcode-project use-profiles

      - name: Build IPA passager
        script: |
          cd "$CM_BUILD_DIR"
          # Le numéro de build doit augmenter à chaque envoi vers App Store Connect.
          flutter build ipa --release \
            --flavor passenger \
            --target lib/main_passenger.dart \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-driver-release:
    name: iOS Chauffeur (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      groups:
        - fraya_env
      ios_signing:
        distribution_type: app_store  # ou ad_hoc pour les tests
        bundle_identifier: com.carrementweb.frayaMobile.driver

    # Intégration App Store Connect (Personal account > Integrations > Developer Portal) : nom a verifier.
    integrations:
      app_store_connect: Keita_Fraya

    scripts:
      - name: Créer le fichier .env
        script: |
          cat > "$CM_BUILD_DIR/.env" << EOF
          GOOGLE_MAPS_API_KEY_ANDROID=$GOOGLE_MAPS_API_KEY_ANDROID
          GOOGLE_MAPS_API_KEY_IOS=$GOOGLE_MAPS_API_KEY_IOS
          GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY
          SERVER_URL=$SERVER_URL
          ONESIGNAL_APP_ID_PASSENGER=$ONESIGNAL_APP_ID_PASSENGER
          ONESIGNAL_APP_ID_DRIVER=$ONESIGNAL_APP_ID_DRIVER
          WHATSAPP_SUPPORT_NUMBER=$WHATSAPP_SUPPORT_NUMBER
          EOF
          echo "✅ .env créé"
          ls -la "$CM_BUILD_DIR/.env"

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Pod install
        script: |
          cd ios && pod install

      - name: Appliquer les profils de signature au projet Xcode
        script: |
          xcode-project use-profiles

      - name: Build IPA chauffeur
        script: |
          cd "$CM_BUILD_DIR"
          # Le numéro de build doit augmenter à chaque envoi vers App Store Connect.
          flutter build ipa --release \
            --flavor driver \
            --target lib/main_driver.dart \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
