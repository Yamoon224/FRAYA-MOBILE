name: Deploy Driver to Play Store (Internal Testing)

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy-driver-playstore.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-driver-playstore
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build & upload driver AAB
    # Seul le dépôt de l'entreprise publie sur le Play Store : un miroir ou un fork n'a pas (et ne doit pas avoir)
    # les secrets de signature, il ignore ce workflow au lieu d'échouer sur « Missing secret ».
    if: github.repository == 'carrementweb/fraya_mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check publishing secrets
        id: check
        shell: bash
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON MOBILE_ENV_FILE; do
            [[ -z "${!name:-}" ]] && missing="$missing $name"
          done
          if [[ -n "$missing" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Play Store publication skipped::Missing secrets:${missing}. Add them in Settings > Secrets and variables > Actions to enable automatic publishing."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MOBILE_ENV_FILE: ${{ secrets.MOBILE_ENV_FILE }}

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Setup Java
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: steps.check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: flutter pub get

      - name: Create .env
        if: steps.check.outputs.ready == 'true'
        run: printf '%s\n' "$MOBILE_ENV_FILE" > .env
        env:
          MOBILE_ENV_FILE: ${{ secrets.MOBILE_ENV_FILE }}

      - name: Decode signing keystore
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/fraya-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Create key.properties
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=${{ github.workspace }}/android/keystore/fraya-release.jks
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Bump build number from Play Store track
        if: steps.check.outputs.ready == 'true'
        run: echo "Using versionCode from pubspec.yaml (version x.y.z+code)."

      - name: Build driver App Bundle (release)
        if: steps.check.outputs.ready == 'true'
        run: flutter build appbundle --release --flavor driver -t lib/main_driver.dart

      - name: Upload to Play Store (internal track)
        if: steps.check.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fraya.taxi.driver.ci
          releaseFiles: build/app/outputs/bundle/driverRelease/app-driver-release.aab
          track: internal
          status: completed

      - name: Remove signing material
        if: always() && steps.check.outputs.ready == 'true'
        run: |
          rm -f android/keystore/fraya-release.jks
          rm -f android/key.properties
          rm -f .env
