name: Deploy Driver to Play Store (Internal Testing)

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy-driver-playstore.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-driver-playstore
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build & upload driver AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON MOBILE_ENV_FILE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing secret: $name. Configure it before deploying."
              exit 1
            fi
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MOBILE_ENV_FILE: ${{ secrets.MOBILE_ENV_FILE }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        run: printf '%s\n' "$MOBILE_ENV_FILE" > .env
        env:
          MOBILE_ENV_FILE: ${{ secrets.MOBILE_ENV_FILE }}

      - name: Decode signing keystore
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/fraya-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Create key.properties
        run: |
          set -euo pipefail
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=${{ github.workspace }}/android/keystore/fraya-release.jks
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Bump build number from Play Store track
        run: echo "Using versionCode from pubspec.yaml (version x.y.z+code)."

      - name: Build driver App Bundle (release)
        run: flutter build appbundle --release --flavor driver -t lib/main_driver.dart

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fraya.taxi.driver.ci
          releaseFiles: build/app/outputs/bundle/driverRelease/app-driver-release.aab
          track: internal
          status: completed

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/keystore/fraya-release.jks
          rm -f android/key.properties
          rm -f .env
