name: fraya_mobile
description: "Fraya Taxi — Application VTC pour Abidjan, Côte d'Ivoire"
publish_to: 'none'
# Source de verite unique de la version (versionName+versionCode cote Android).
# A INCREMENTER a chaque APK envoye a un client ou a un testeur.
version: 1.0.2+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / Design
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.17
  lottie: ^3.3.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.2.3

  # Network / HTTP
  dio: ^5.8.0+1
  socket_io_client: ^3.0.2
  onesignal_flutter: 5.5.4
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.0.5

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.2.0

  # Maps
  google_maps_flutter: ^2.17.0

  # Functional Programming
  dartz: ^0.10.1

  # Utils
  intl: ^0.20.2
  logger: ^2.5.0
  equatable: ^2.0.7
  geolocator: ^14.0.2
  connectivity_plus: ^7.1.1
  flutter_dotenv: ^6.0.1
  flutter_polyline_points: ^3.1.0
  dotted_border: ^3.1.0
  share_plus: ^12.0.2
  flutter_image_compress: ^2.5.1
  pdf: ^3.12.0
  pdfx: ^2.9.2
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  font_awesome_flutter: ^11.0.0
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.3
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/config/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/songs/

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/images/fraya_taxi_phone_icon.png"
  image_path_ios: "assets/images/fraya_taxi_phone_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/fraya_taxi_phone_icon.png"

flutter_native_splash:
  color: "#000000"
  image: assets/images/fraya_taxi_phone_splash.png
  android: true
  ios: true
  android_12:
    color: "#000000"
    image: assets/images/fraya_taxi_phone_splash.png
